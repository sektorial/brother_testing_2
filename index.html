<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Тренажер тестів</title>
  <script>
    (function () {
      var path = location.pathname;
      if (!path.endsWith("/")) {
        path = /\.[a-z0-9]+$/i.test(path) ? path.replace(/[^/]*$/, "") : path + "/";
      }
      var base = document.createElement("base");
      base.href = path;
      document.head.appendChild(base);
    })();
  </script>
  <link rel="stylesheet" href="assets/app.css?v=1.1.0" />
</head>
<body>
  <div id="app">
    <header class="top">
      <button type="button" id="btn-home" class="ghost" hidden>← Меню</button>
      <div class="title-wrap">
        <h1 id="title">Тренажер</h1>
        <p id="app-version" class="version">Версія 1.1.0</p>
      </div>
      <span id="timer" class="timer" hidden>20:00</span>
      <button type="button" id="btn-logout" class="ghost" hidden>Вийти</button>
    </header>

    <main id="screen-login" class="screen" hidden>
      <h2>Вхід</h2>
      <form id="login-form" class="stack">
        <label class="answer-label">Ім'я
          <input id="login-user" name="username" autocomplete="username" />
        </label>
        <label class="answer-label">Пароль
          <input id="login-pass" name="password" type="password" autocomplete="current-password" />
        </label>
        <p id="login-error" class="warn" hidden>Невірне ім'я або пароль.</p>
        <button type="submit" class="primary">Увійти</button>
      </form>
    </main>

    <main id="screen-home" class="screen" hidden>
      <p class="lead">Оберіть бібліотеку тестів. Далі — пули в межах наявних блоків: вербальний, математичний або абстрактно-логічний.</p>
      <div id="source-list" class="stack"></div>
      <p id="load-error" class="warn" hidden></p>
    </main>

    <main id="screen-pools" class="screen" hidden>
      <p id="pools-lead" class="lead"></p>
      <div id="pool-list" class="stack"></div>
    </main>

    <main id="screen-break" class="screen" hidden>
      <h2>Перерва</h2>
      <p id="break-text" class="lead"></p>
      <div class="stack">
        <button type="button" id="btn-next-pool" class="primary">Почати наступний пул</button>
        <button type="button" id="btn-break-pools" class="secondary">До списку пулів</button>
      </div>
    </main>

    <main id="screen-quiz" class="screen" hidden>
      <p id="quiz-meta" class="meta"></p>
      <div id="marks" class="marks">
        <button type="button" class="mark" data-mark="flag" aria-pressed="false">Прапорець</button>
        <button type="button" class="mark" data-mark="heart" aria-pressed="false">Серце</button>
        <button type="button" class="mark" data-mark="star" aria-pressed="false">Зірка</button>
      </div>
      <p id="prompt" class="prompt"></p>
      <div id="stimulus" class="stimulus"></div>
      <div id="choices" class="choices"></div>
      <label id="answer-label" class="answer-label" hidden>
        <span id="answer-hint"></span>
        <input id="answer-input" type="text" autocomplete="off" enterkeyhint="done" />
      </label>
      <p id="note" class="note" hidden></p>
      <p id="verdict" class="verdict" hidden></p>
      <p id="explanation" class="explanation" hidden></p>
      <div class="row">
        <button type="button" id="btn-confirm" class="primary" disabled>Підтвердити</button>
        <button type="button" id="btn-prev" class="secondary">Назад</button>
        <button type="button" id="btn-next" class="secondary">Далі</button>
      </div>
      <button type="button" id="btn-finish" class="ghost finish">Завершити пул</button>
    </main>

    <main id="screen-summary" class="screen" hidden>
      <h2>Результат</h2>
      <p id="summary-text" class="lead"></p>
      <div class="stack">
        <button type="button" id="btn-review" class="secondary">Переглянути питання</button>
        <button type="button" id="btn-wrong" class="secondary" hidden>Пройти питання з неправильною відповіддю</button>
        <div id="mark-retries" class="stack"></div>
        <button type="button" id="btn-break" class="primary" hidden>Перерва перед наступним пулом</button>
        <button type="button" id="btn-retry" class="secondary">Пройти цей пул знову</button>
        <button type="button" id="btn-summary-pools" class="ghost">До списку пулів</button>
      </div>
    </main>
  </div>
  <script src="assets/version.js?v=1.1.0"></script>
  <script src="assets/auth.js?v=1.1.2"></script>
  <script src="assets/app.js?v=1.1.1"></script>
</body>
</html>
